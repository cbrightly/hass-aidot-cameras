name: CI

# The integration's own test gate. Until now a dev push ran no tests - the
# suite only ran in CI via the library repo's downstream job against the last
# PUBLISHED tag, so a dev change could sit red for a whole release cycle (that
# is exactly how 2.41.0 shipped two failing signature tests). This runs the
# full suite, ruff, the HA manifest validator and a coverage report on every
# push and PR, so a dev change is gated where it is made.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      library_ref:
        description: "Library branch, tag or full sha for the canary job (default: main)"
        required: false
        type: string
  schedule:
    - cron: "17 6 * * 1"   # weekly - catch HA / library drift

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff) and JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format (check only)
        run: ruff format --check .
      - name: Validate manifest, strings and translations JSON
        run: |
          python - <<'PY'
          import glob, json
          for f in sorted(set(
              glob.glob("custom_components/aidot/*.json")
              + glob.glob("custom_components/aidot/translations/*.json")
          )):
              json.load(open(f))
              print("ok", f)
          m = json.load(open("custom_components/aidot/manifest.json"))
          for k in ("domain", "name", "codeowners", "requirements", "version"):
              assert k in m, f"manifest missing required key: {k}"
          print("manifest required keys present")
          PY

  tests:
    name: Tests + coverage (HA current)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ffmpeg
        # The clip test needs it; without it the test skips, and the skip guard
        # (AIDOT_FAIL_ON_SKIP) fails the run instead of passing on nothing.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && ffmpeg -version | head -1
      - name: Install test dependencies
        # The library requirement is read from the manifest so a floor bump is a
        # one-file change. Retry: a fresh library release can lag PyPI index
        # propagation by a minute or two, and a floor bump raced against its own
        # release would otherwise fail here.
        run: |
          set -euo pipefail
          REQ=$(python -c "import json; print([r for r in json.load(open('custom_components/aidot/manifest.json'))['requirements'] if 'python-aidot-cameras' in r][0])")
          echo "library requirement from manifest: $REQ"
          for i in 1 2 3 4 5; do
            pip install -r requirements_test.txt pytest-timeout pytest-cov "$REQ" && break
            echo "install attempt $i failed - retrying in 45s"; sleep 45
            [ "$i" = 5 ] && { echo "install failed after 5 attempts" >&2; exit 1; }
          done
      - name: Show what is under test
        run: |
          python -c "from homeassistant.const import __version__ as v; print('HA', v)"
          python -c "import aidot_cameras; print('library', aidot_cameras.__file__)"
      - name: Run tests with coverage
        # Coverage gates the build: --cov-fail-under fails this step if coverage
        # drops below the floor, so a deleted test or new untested code is
        # caught here. Raise the floor when coverage rises; never lower it to
        # make a red build pass. term-missing shows which lines regressed.
        env:
          AIDOT_FAIL_ON_SKIP: "1"
        run: pytest tests/ -q --timeout=180 --cov=custom_components.aidot --cov-report=term-missing --cov-fail-under=83

  hassfest:
    name: Hassfest (HA manifest schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  # Runs the suite against an UNRELEASED library, informational only (never
  # gates). Three ways in:
  #   - the weekly schedule and a bare manual run use the library's main;
  #   - a manual run can name any branch, tag or sha of the public library
  #     in `library_ref`;
  #   - a pull request whose description has a line `Library-Ref: <ref>` runs
  #     against that ref - for an integration change that depends on library
  #     work not on PyPI yet, so its tests run for real instead of skipping.
  # The library is public, so nothing here needs a credential, and the
  # direction is private -> public: the public library never reaches in here.
  # The ref reaches the shell through env only and is checked against the
  # library's own refs before anything is installed.
  library-canary:
    name: Canary against an unreleased library (informational)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.body, 'Library-Ref:'))
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Pick the library ref
        id: ref
        env:
          IN_DISPATCH_REF: ${{ inputs.library_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          REF="${IN_DISPATCH_REF:-}"
          if [ -n "${PR_BODY:-}" ]; then
            REF="$(printf '%s\n' "$PR_BODY" | tr -d '\r' | sed -nE 's/^[[:space:]]*Library-Ref:[[:space:]]*`?([^`[:space:]]+)`?[[:space:]]*$/\1/p' | head -1)"
          fi
          REF="${REF:-main}"
          if ! [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::library ref '$REF' has characters a ref here may not"; exit 1
          fi
          LIB=https://github.com/cbrightly/python-aidot-cameras
          if git ls-remote --exit-code "$LIB" "refs/heads/$REF" "refs/tags/$REF" >/dev/null; then
            :
          elif [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            :  # a full sha; pip fails loudly if the library has no such commit
          else
            echo "::error::'$REF' is not a branch or tag of the library (pass a full 40-char sha otherwise)"; exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "library ref: $REF"
      - name: Install ffmpeg
        # The clip test needs it; without it the test skips, and the skip guard
        # (AIDOT_FAIL_ON_SKIP) fails the run instead of passing on nothing.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && ffmpeg -version | head -1
      - name: Install against that library ref
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          pip install -r requirements_test.txt pytest-timeout
          pip install "python-aidot-cameras[webrtc] @ git+https://github.com/cbrightly/python-aidot-cameras@${REF}"
          python -c "import aidot_cameras; print('library (${REF}):', aidot_cameras.__file__)"
      - name: Run tests against the unreleased library
        # Unexpected skips fail: a test that skipped against the ref it was
        # meant to exercise proved nothing.
        env:
          AIDOT_FAIL_ON_SKIP: "1"
        run: pytest tests/ -q --timeout=180
