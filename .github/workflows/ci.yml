name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly - catch HACS/brands drift on the default branch

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs inside an Alpine (musl) container - the same runtime Home Assistant
  # OS / Container uses - so checks run exactly where the integration lives.
  # Alpine container jobs REQUIRE node24-runtime actions (checkout@v5+): GitHub's
  # node20 binary is glibc-only and cannot execute inside a musl container.
  validate:
    name: Validate (Alpine / musl - HA runtime)
    runs-on: ubuntu-latest
    container: python:3.13-alpine
    steps:
      - uses: actions/checkout@v5        # node24 (mandatory in a musl container)
      - run: apk add --no-cache git
      - run: pip install ruff
      # A real gate over the repo's tuned ruff.toml (high-signal rules; style is
      # left to the formatter). This replaces a flake8 pass narrowed to syntax
      # errors and undefined names - a selector that let an undefined _LOGGER
      # ship in two releases while the test suite stayed green, because the
      # only code path that read it was unreachable in tests.
      - name: Ruff lint
        run: ruff check .
      - name: Validate JSON (manifest, strings, translations)
        run: |
          python - <<'PY'
          import json, glob
          for f in sorted(set(
              glob.glob("custom_components/aidot/*.json")
              + glob.glob("custom_components/aidot/translations/*.json")
          )):
              json.load(open(f))
              print("ok", f)
          m = json.load(open("custom_components/aidot/manifest.json"))
          for k in ("domain", "name", "codeowners", "requirements", "version"):
              assert k in m, f"manifest missing required key: {k}"
          print("manifest required keys present")
          PY

  tests:
    # The HA version is NOT pinned here, and the name says which one ran rather
    # than asserting one: requirements_test.txt takes the newest
    # pytest-homeassistant-custom-component, which takes the newest Home
    # Assistant ON PyPI. That is not the newest Home Assistant - HA OS ships
    # releases PyPI does not have (2026.9.x on a box while PyPI topped out at
    # 2026.2.3), and 2026.9 removing `via_device` broke 50 entities on exactly
    # that gap. Nothing here can close it, so the guard is
    # tests/test_device_info_keys_exist_in_this_ha.py, which refuses to emit an
    # API key the RUNNING Home Assistant does not declare, whichever that is.
    name: Tests (Python 3.13 / newest HA on PyPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        # The library requirement is read from the manifest so a floor bump is a
        # one-file change, and the install retries because a fresh library
        # release can lag PyPI index propagation by a minute or two - a floor
        # bump raced against its own release failed this job three times on
        # 2026-07-05.
        run: |
          REQ=$(python -c "import json; print(json.load(open('custom_components/aidot/manifest.json'))['requirements'][0])")
          echo "library requirement from manifest: $REQ"
          # Wait for the pinned floor to be VISIBLE on the simple index before
          # installing. A release reaches the API before pip's index, and a
          # floor bump pushed straight after its own release outran the retry
          # loop below on 2026-09-19 (five attempts, all "No matching
          # distribution"). Waiting on the index says plainly which of the two
          # failure modes happened: "never appeared" (release not finished)
          # versus "appeared, install still failed" (a real problem).
          python - "$REQ" <<'PY'
          import re, sys, time, urllib.request

          req = sys.argv[1]
          m = re.search(r">=\s*([0-9][^,;\s]*)", req)
          if not m:
              print("no floor version in the requirement - skipping the wait")
              sys.exit(0)
          want = m.group(1)
          url = "https://pypi.org/simple/python-aidot-cameras/"
          deadline = time.time() + 600
          while time.time() < deadline:
              try:
                  page = urllib.request.urlopen(url, timeout=20).read().decode()
              except Exception as exc:  # transient index/CDN failure
                  print(f"index fetch failed ({exc!r}) - retrying")
              else:
                  if f"python_aidot_cameras-{want}-" in page or f"-{want}.tar.gz" in page:
                      print(f"{want} is visible on the simple index")
                      sys.exit(0)
                  print(f"{want} not on the simple index yet - waiting")
              time.sleep(20)
          print(f"::error::{want} never appeared on the PyPI simple index")
          print("::error::Publish the library release first, then re-run this job.")
          sys.exit(1)
          PY
          # pip is the only view that counts. The index check above can pass
          # while pip is still served a stale CDN copy of the simple page -
          # measured on 2026-09-20, where the check saw the new version and
          # pip's version list did not for another four minutes. So retry the
          # install itself over a window longer than that skew.
          for i in $(seq 1 10); do
            pip install --no-cache-dir -r requirements_test.txt "$REQ" && exit 0
            echo "install attempt $i failed - retrying in 60s"
            sleep 60
          done
          echo "::error::install failed after 10 attempts over ~10 minutes" >&2
          echo "::error::If the version is published, this is index propagation; re-run the job." >&2
          exit 1
      - name: Report the Home Assistant actually under test
        # Printed on every run so the gap against a user's HA OS build is
        # visible in the log rather than assumed from the job name.
        run: |
          python - <<'PY'
          import homeassistant.const as c
          from homeassistant.helpers.device_registry import DeviceInfo
          keys = sorted(DeviceInfo.__annotations__)
          print(f"homeassistant under test: {c.__version__}")
          print(f"DeviceInfo declares via_device={'via_device' in keys} "
                f"via_device_id={'via_device_id' in keys}")
          PY
      - name: Run tests
        run: pytest tests/ -v --timeout=30

  # HACS structural validation (hacs.json, manifest, brands, repo layout) so a
  # broken custom-repo install is caught in CI, not by users.
  #
  # IMPORTANT - core-integration override: this integration deliberately claims
  # the `aidot` domain, REPLACING Home Assistant's built-in core AiDot
  # integration (which is lights-only) with full camera + light support. That
  # override is intentional and is exactly why this ships as a HACS *custom*
  # repository and is NOT eligible for the HACS default store - core already owns
  # `aidot` there. The validation below checks the repo is a well-formed custom
  # integration; it is not a bid for default-store inclusion.
  hacs:
    name: HACS validation (custom repo)
    # hacs/action fetches repo file content over the GitHub API to validate
    # hacs.json and the integration manifest. That fetch does NOT work against
    # this PRIVATE dev repo - a valid hacs.json still reports "invalid" and the
    # manifest reads as "Got None" - and `integration_manifest` is not an
    # ignorable check, so the job can only pass where the repo is PUBLIC. This
    # exact workflow is published (unchanged) to the public distribution repo, so
    # the job is gated to run THERE (on main / weekly), where the checks are both
    # meaningful and green. On the private dev repo it skips; hassfest below is
    # the manifest gate that runs everywhere.
    if: >-
      github.repository == 'cbrightly/hass-aidot-cameras' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration
          # `brands` is skipped because of the core override: the `aidot` brand
          # in home-assistant/brands belongs to core's built-in integration, so
          # this custom repo can neither own nor duplicate it. Every other check
          # (hacs.json, integration_manifest, wheels, repo metadata) stays on.
          ignore: brands

  # Home Assistant's own manifest/translation validator. Keeps the manifest honest
  # (required keys, dependency/version formats) against the current HA schema.
  hassfest:
    name: Hassfest (HA manifest schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master
