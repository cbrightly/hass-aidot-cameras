name: CI

# The integration's own test gate. Until now a dev push ran no tests - the
# suite only ran in CI via the library repo's downstream job against the last
# PUBLISHED tag, so a dev change could sit red for a whole release cycle (that
# is exactly how 2.41.0 shipped two failing signature tests). This runs the
# full suite, ruff, the HA manifest validator and a coverage report on every
# push and PR, so a dev change is gated where it is made.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # weekly - catch HA / library drift

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff) and JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format (check only)
        run: ruff format --check .
      - name: Validate manifest, strings and translations JSON
        run: |
          python - <<'PY'
          import glob, json
          for f in sorted(set(
              glob.glob("custom_components/aidot/*.json")
              + glob.glob("custom_components/aidot/translations/*.json")
          )):
              json.load(open(f))
              print("ok", f)
          m = json.load(open("custom_components/aidot/manifest.json"))
          for k in ("domain", "name", "codeowners", "requirements", "version"):
              assert k in m, f"manifest missing required key: {k}"
          print("manifest required keys present")
          PY

  tests:
    name: Tests + coverage (HA current)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        # The library requirement is read from the manifest so a floor bump is a
        # one-file change. Retry: a fresh library release can lag PyPI index
        # propagation by a minute or two, and a floor bump raced against its own
        # release would otherwise fail here.
        run: |
          set -euo pipefail
          REQ=$(python -c "import json; print([r for r in json.load(open('custom_components/aidot/manifest.json'))['requirements'] if 'python-aidot-cameras' in r][0])")
          echo "library requirement from manifest: $REQ"
          for i in 1 2 3 4 5; do
            pip install -r requirements_test.txt pytest-timeout pytest-cov "$REQ" && break
            echo "install attempt $i failed - retrying in 45s"; sleep 45
            [ "$i" = 5 ] && { echo "install failed after 5 attempts" >&2; exit 1; }
          done
      - name: Show what is under test
        run: |
          python -c "from homeassistant.const import __version__ as v; print('HA', v)"
          python -c "import aidot_cameras; print('library', aidot_cameras.__file__)"
      - name: Run tests with coverage
        # Coverage is informational (term-missing report); it does not gate the
        # build. It gives the number a future hardening pass can raise a floor on.
        run: pytest tests/ -q --timeout=180 --cov=custom_components.aidot --cov-report=term-missing

  hassfest:
    name: Hassfest (HA manifest schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  library-canary:
    name: Canary against library main (informational)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install against the library's main branch
        run: |
          pip install -r requirements_test.txt pytest-timeout
          pip install "python-aidot-cameras[webrtc] @ git+https://github.com/cbrightly/python-aidot-cameras@main"
          python -c "import aidot_cameras; print('library (main):', aidot_cameras.__file__)"
      - name: Run tests against the unreleased library
        run: pytest tests/ -q --timeout=180
